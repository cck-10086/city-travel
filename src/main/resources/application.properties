spring.application.name=city-travel
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/city_travel?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&characterSetResults=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.citytravel.citytravel.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

spring.data.redis.host=localhost
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}

#spring.http.encoding.charset=UTF-8
#spring.http.encoding.force=true
#spring.http.encoding.enabled=true
server.tomcat.uri-encoding=UTF-8

spring.jackson.charset=UTF-8
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# DeepSeek AI配置：密钥只允许通过环境变量注入
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
ai.deepseek.api-url=${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}

# AI成本控制配置
ai.cost.enabled=true
ai.cost.daily-limit=100
ai.cost.hourly-limit=10
ai.cost.max-tokens=2000
ai.cost.cache-enabled=true
ai.cost.cache-minutes=30

# 安全与上传配置
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:${user.dir}/uploads}

# 默认不创建固定口令的演示账号；本地演示时显式设置为 true
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
app.demo-data.password=${APP_DEMO_DATA_PASSWORD:}
